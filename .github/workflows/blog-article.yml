name: 에버그린 블로그 글 발행 (3일 1편)

on:
  schedule:
    # 매일 UTC 19:30 = KST 04:30. 매일 돌지만 publish_blog_article.py가 3일 간격을
    # 스스로 게이트하므로 실제 발행은 3일에 1편. daily-content.yml(04:45 KST 목표)보다
    # 조금 먼저 돌려서, 아침 sync_content.bat(2026-08부터 06:00/06:20 KST로 당김)가
    # 받아가기 전에 커밋되게 한다. 교육글은 시의성이 없어 휴장일·주말에도 발행 OK라
    # 요일 제한 없이 매일(*).
    - cron: '30 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 생성 스크립트는 requests만 필요(무거운 requirements.txt 전체는 불필요).
      - name: 의존성 설치
        run: pip install requests

      - name: 발행 (3일 간격 자동 게이트, 큐 비면 Claude API로 자동 생성)
        env:
          # 큐(손으로 쓴 글)가 비었을 때만 Claude API로 새 글을 생성한다.
          # 미설정이면 생성은 건너뛰고 발행만 시도(경고만).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python publish_blog_article.py

      - name: 변경사항 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 자동 생성 시 blog_articles/(새 글 파일 + queue.txt)도 바뀌므로 함께 스테이징해야
          # rebase 전에 unstaged 에러가 안 남(실제로 겪은 문제).
          git add content_out/ data/blog_article_state.json data/claude_api_status.json blog_articles/
          git diff --staged --quiet && echo "변경 없음(발행 없거나 대기 중)" || {
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 에버그린 블로그 글 발행 $DATE_KST"
            # data/claude_api_status.json은 econ-briefing.yml 등 다른 워크플로우도 같이
            # 커밋하는 공유 카운터 파일이라, 비슷한 시각에 겹치면 그 파일만 rebase
            # 충돌이 나 이 커밋 전체가 유실될 수 있었음(2026-09-08 실제 사고). 그 파일
            # 하나만 충돌하면 그 충돌만 접어두고 진행(git rebase 중 --theirs는 병합
            # 때와 반대로 '지금 재생 중인 이 커밋 자신의 값'을 뜻함 — 단순 집계
            # 카운터라 어느 쪽이 남든 상관없고 다음 성공 실행이 다시 갱신하므로
            # 손실도 없음). 진짜 콘텐츠 충돌이면 여전히 실패시켜 수동 확인하게 한다.
            ok=0
            for i in 1 2; do
              if git push; then ok=1; break; fi
              git fetch origin main
              if git rebase origin/main; then continue; fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/claude_api_status.json" ]; then
                git checkout --theirs data/claude_api_status.json
                git add data/claude_api_status.json
                git rebase --continue
              else
                echo "::error::rebase 충돌 — content_out을 동시에 건드린 다른 작업 확인 필요: $conflicts"
                git rebase --abort
                exit 1
              fi
            done
            [ "$ok" = "1" ] || { echo "::error::재시도 후에도 push 실패"; exit 1; }
          }
