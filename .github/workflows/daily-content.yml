name: 블로그·인스타 콘텐츠 자동 생성

on:
  schedule:
    # 매 평일+토요일 UTC 20:45 = KST 05:45(다음날) 목표. 일~금 UTC로 지정해야 월~토
    # KST 아침이 된다(토요일 KST 실행분은 daily_content.py 안에서 요일 체크로
    # '주간 마무리' 콘텐츠로 자동 분기 — send_newsletter.py의 토요일 분기와 동일 패턴).
    # GitHub Actions 스케줄은 정시 실행을 보장하지 않고 실측상 50~60분(가끔 그 이상도)
    # 늦게 실행돼서, 완료 시각이 07:30 KST보다 확실히 앞서도록(출근 전에 올릴 수
    # 있어야 한다는 요청) 목표를 06:30 → 05:45로 45분 더 당겼다(기존에도 원래
    # 07:30 목표에서 1시간 당긴 상태였음). daily-prices.yml이 전날 저녁(KST 19:00)에
    # 이미 최신 시세를 반영해두므로 이 시각에 실행해도 데이터는 최신 상태. 평일
    # 휴장일엔 daily_content.py가 자동으로 아무것도 안 만듦. 인스타 게시는 여기서
    # 바로 하지 않고 daily-instagram-post.yml이 따로 함(콘텐츠 생성과 게시 시간을
    # 분리해달라는 요청 반영) — 이 워크플로우와 30분 간격을 유지하도록 같이 당겼다.
    - cron: '45 20 * * 0-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 블로그 초안 + 인스타 카드뉴스·캡션 생성
        env:
          KR_DB_PATH: data/screener_deploy.db
          # 안 넣으면 app.py::BASE_URL이 https://example.com으로 폴백돼 블로그 초안 본문의
          # "전 종목 스크리닝..." 링크가 그대로 example.com으로 박힘(실제로 발생했던 버그).
          SITE_BASE_URL: https://getmoneycheckup.com
          # 저장소 시크릿엔 있었지만 이 스텝 env로 실제로 넘겨주는 걸 빠뜨렸던 버그 —
          # 이게 없으면 generate_kr_briefing.py/generate_kr_card_copy.py가 매번 조용히
          # 템플릿 폴백만 타서, Claude 전환 자체가 한 번도 실제로 작동 안 하는 상태였음.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_content.py

      - name: 변경사항 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/ data/claude_api_status.json
          # 커밋 메시지 날짜는 UTC가 아니라 KST로 — content_out/ 폴더명(KST 기준)과
          # 어긋나서 헷갈렸던 적이 있었음(UTC 밤 실행이라 폴더는 다음날인데 커밋 메시지는
          # 실행 당일로 찍힘).
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          git diff --staged --quiet && echo "변경 없음" || \
            (git commit -m "chore: 오늘자 블로그·인스타 콘텐츠 생성 $DATE_KST" && git push)
