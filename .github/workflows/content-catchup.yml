name: 콘텐츠 자가복구 (스케줄 누락 대비)

on:
  schedule:
    # daily-content.yml(정규 04:45 KST 목표)이 GitHub 스케줄러 누락/지연으로 아예
    # 안 도는 사고가 실제로 있었음(2026-08-07: 08/06 20:45 UTC 슬롯이 통째로 드롭돼
    # 8/7 글 미생성). GitHub의 스케줄 이벤트는 부하 시 몇 시간 지연되거나 통째로
    # 누락될 수 있는 알려진 한계라, "단일 슬롯"에 의존하면 언젠가 또 빠진다.
    # → 정규 슬롯 이후로 하루 여러 번 재시도하는 백스톱. daily_content.py는 멱등이라
    #   (이미 있으면/일요일/휴장일이면 즉시 스킵) 대부분의 실행은 몇 초 만에 no-op이고,
    #   진짜 빠진 날에만 생성·커밋한다. 여러 슬롯 중 하나만 실제로 떠도 그날은 복구됨.
    # 2026-08 사용자 일정 변경(06:00 KST까지 사이트에 올라와 있어야 함, 로컬
    # sync_content.bat도 06:00/06:20으로 당김)에 맞춰 05:20 KST 백스톱을 새로 추가 —
    # 정규 실행이 통째로 드롭돼도 로컬 pull(06:00) 전에 한 번 더 복구 기회가 있다.
    # UTC 20:20 = KST 05:20 (신규, 06:00 로컬 pull 전 마지막 방어선).
    - cron: '20 20 * * *'
    # UTC 22,01,04,07 = KST 07:00, 10:00, 13:00, 16:00 (그 이후로도 낮 동안 4개 백스톱).
    - cron: '0 22,1,4,7 * * *'
  workflow_dispatch: {}

# 정규 daily-content 실행이나 다른 자가복구 슬롯과 겹쳐 push 충돌 나는 걸 막는다.
concurrency:
  group: content-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘치 콘텐츠 보장 (없으면 생성, 있으면 멱등 스킵)
        env:
          KR_DB_PATH: data/screener_deploy.db
          SITE_BASE_URL: https://getmoneycheckup.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_content.py

      - name: 변경 있으면 커밋 + 푸시 (충돌 시 rebase 후 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/ data/claude_api_status.json data/cover_history.json
          DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          if git diff --staged --quiet; then
            echo "변경 없음 — 오늘치 이미 존재(정상)."
          else
            git commit -m "chore: 콘텐츠 자가복구 $DATE_KST"
            # data/claude_api_status.json은 econ-briefing.yml 등 다른 워크플로우도 같이
            # 커밋하는 공유 카운터 파일이라, 비슷한 시각에 겹치면 그 파일만 rebase
            # 충돌이 나 이 실행의 커밋 전체가 유실될 수 있었음(2026-09-08 실제 사고).
            # 그 파일 하나만 충돌하면 그 충돌만 접어두고 진행(git rebase 중 --theirs는
            # 병합 때와 반대로 '지금 재생 중인 이 커밋 자신의 값'을 뜻함 — 단순 집계
            # 카운터라 어느 쪽이 남든 상관없고 다음 성공 실행이 다시 갱신하므로 손실도
            # 없음). 진짜 콘텐츠 충돌이면 여전히 실패시켜 수동 확인하게 한다.
            ok=0
            for i in 1 2; do
              if git push; then ok=1; break; fi
              git fetch origin main
              if git rebase origin/main; then continue; fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/claude_api_status.json" ]; then
                git checkout --theirs data/claude_api_status.json
                git add data/claude_api_status.json
                git rebase --continue
              else
                echo "::error::rebase 충돌(콘텐츠 파일 포함) — 수동 확인 필요: $conflicts"
                git rebase --abort
                exit 1
              fi
            done
            [ "$ok" = "1" ] || { echo "::error::재시도 후에도 push 실패"; exit 1; }
          fi
