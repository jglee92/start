name: 교육 가이드 삽화 생성 (주 1회)

on:
  schedule:
    # 주 1회. 새로 발행된 가이드에만 삽화를 생성(내용 해시로 기존분은 스킵 → 과금 0).
    # UTC 월 18:30 = KST 화 03:30.
    - cron: '30 18 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 가이드 개념 삽화 생성(신규분만)
        env:
          KR_DB_PATH: data/screener_deploy.db
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python generate_guide_images.py

      - name: 변경 있으면 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.editor true
          git add static/guide_img data/guide_images.json
          if git diff --staged --quiet; then
            echo "변경 없음(신규 가이드 없음)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 교육 가이드 삽화 생성 $DATE_KST"
            # ai-cards.yml과 같은 패턴(git pull --rebase 한 번)이 2026-11-10 비슷한
            # 시각에 다른 워크플로우가 먼저 push하면 그대로 실패해 콘텐츠가 유실되는
            # 버그였음 — 같은 이유로 fetch+rebase 재시도로 교체.
            ok=0
            for i in 1 2; do
              if git push; then ok=1; break; fi
              git fetch origin main
              if git rebase origin/main; then continue; fi
              echo "::error::rebase 충돌 — 수동 확인 필요: $(git diff --name-only --diff-filter=U)"
              git rebase --abort
              exit 1
            done
            [ "$ok" = "1" ] || { echo "::error::재시도 후에도 push 실패"; exit 1; }
          fi
