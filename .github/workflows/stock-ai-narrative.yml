name: 종목별 AI 해설 생성 (주 1회)

on:
  schedule:
    # 주 1회. 재무는 분기 단위로만 바뀌고 generate_stock_ai.py가 데이터 해시로
    # 변동 없는 종목은 건너뛰므로(과금 0), 주 1회면 충분하다. UTC 일 18:00 = 월 03:00 KST.
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 색인 상위 종목 AI 종합해설 생성(변동분만)
        env:
          KR_DB_PATH: data/screener_deploy.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_stock_ai.py

      - name: 변경 있으면 커밋 + 푸시 (충돌 시 rebase 후 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git rebase --continue가 비대화형 러너에서 커밋 메시지 편집기를 열려다
          # "Terminal is dumb, but EDITOR unset"으로 실패해, 아래 충돌 자동복구
          # 로직 자체가 또 콘텐츠를 유실시킨 사고가 있었음(2026-09-09, econ-briefing.yml
          # 에서 발견). 편집기를 안 열고 기존 메시지를 그대로 쓰게 no-op 에디터로 고정.
          git config core.editor true
          git add data/stock_ai_narratives.json data/claude_api_status.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 모든 상위 종목 데이터 그대로(정상)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 종목별 AI 해설 갱신 $DATE_KST"
            # data/claude_api_status.json은 econ-briefing.yml 등 다른 워크플로우도 같이
            # 커밋하는 공유 카운터 파일이라, 비슷한 시각에 겹치면 그 파일만 rebase
            # 충돌이 나 이 커밋 전체가 유실될 수 있었음(2026-09-08 실제 사고, 다른
            # 워크플로우에서 발생). 그 파일 하나만 충돌하면 그 충돌만 접어두고 진행
            # (git rebase 중 --theirs는 병합 때와 반대로 '지금 재생 중인 이 커밋
            # 자신의 값'을 뜻함 — 단순 집계 카운터라 어느 쪽이 남든 상관없고 다음
            # 성공 실행이 다시 갱신하므로 손실도 없음). 진짜 콘텐츠 충돌이면 여전히
            # 실패시켜 수동 확인하게 한다.
            ok=0
            for i in 1 2; do
              if git push; then ok=1; break; fi
              git fetch origin main
              if git rebase origin/main; then continue; fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/claude_api_status.json" ]; then
                git checkout --theirs data/claude_api_status.json
                git add data/claude_api_status.json
                git rebase --continue
              else
                echo "::error::rebase 충돌(콘텐츠 파일 포함) — 수동 확인 필요: $conflicts"
                git rebase --abort
                exit 1
              fi
            done
            [ "$ok" = "1" ] || { echo "::error::재시도 후에도 push 실패"; exit 1; }
          fi
