name: 뉴스레터 자동 발송

on:
  schedule:
    # 매 평일+토요일(KST) 08:30 = UTC 전날 23:30. 일~금 UTC로 지정해야 월~토 KST 아침이 된다.
    # 토요일 발송분은 send_newsletter.py 안에서 평일 브리핑 대신 '주간 마무리' 요약으로 분기됨.
    - cron: '30 23 * * 0-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스레터 발송 (블로그 초안과 동일 내용, 휴장일엔 자동 스킵)
        env:
          KR_DB_PATH: data/screener_deploy.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          # 안 넣으면 app.py::BASE_URL이 https://example.com으로 폴백돼 실제 구독자 메일의
          # "전 종목 스크리닝..." 링크가 죽은 example.com으로 나감(실제로 발생했던 버그).
          SITE_BASE_URL: https://getmoneycheckup.com
          # daily-content.yml과 같은 이유로 필요 — 없으면 generate_kr_briefing.py가
          # 매번 조용히 템플릿 폴백만 탐(Claude 전환이 실제로는 한 번도 작동 안 함).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python send_newsletter.py
