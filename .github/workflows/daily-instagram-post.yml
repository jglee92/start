name: 인스타그램 자동 게시

on:
  schedule:
    # 매 평일+토요일 UTC 21:15 = KST 06:15(다음날) 목표. daily-content.yml을 05:45
    # 목표로 45분 당기면서(출근 전 07:30까지는 확실히 끝나야 한다는 요청) 이 워크플로우도
    # 같은 30분 간격을 유지하도록 같이 당겼다 — daily-content.yml이 그날 콘텐츠를 이미
    # 커밋해둔 뒤라야 하므로 순서가 바뀌면 안 됨. GitHub Actions 스케줄 실행이 실측상
    # 50~60분 정도 늦게 실행되는 점도 동일하게 감안. daily-content.yml이 그날 콘텐츠를
    # 이미 커밋해둔 뒤라, 여기서는 재생성 없이 오늘자 content_out/ 폴더를 그대로 게시만
    # 한다 — 콘텐츠 생성과 게시 시간을 분리해달라는 요청 반영. 토요일 분량(주간 마무리
    # 카드)도 daily-content.yml이 같은 폴더 구조로 만들어두므로 post_to_instagram.py는
    # 요일 구분 없이 그대로 재사용된다.
    - cron: '15 21 * * 0-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests

      - name: 인스타그램 자동 게시
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python post_to_instagram.py
