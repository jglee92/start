name: 인스타그램 자동 게시

on:
  # 스케줄 자동 실행 중단(2026-09-04, 사용자 결정) — post_to_instagram.py가 읽던
  # content_out/{date}/cards/ 폴더가 daily_content.py 개편(2026-09-02, 카드/캡션을
  # ai_card_candidates/로 통합)으로 더 이상 생성되지 않아, 이 워크플로우는 매일
  # "성공"으로 뜨지만 실제로는 아무것도 안 올리는 상태였다(post_to_instagram.py의
  # 72-75행 graceful skip). 사용자가 인스타 게시는 수동으로 콘텐츠를 골라 직접
  # 올리길 원해 자동 게시 자체를 끄기로 함. workflow_dispatch(수동 실행)는 남겨둠 —
  # 나중에 재개하려면 post_to_instagram.py가 ai_card_candidates/를 읽도록 고친 뒤
  # 아래 schedule을 다시 추가할 것.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests

      - name: 인스타그램 자동 게시
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python post_to_instagram.py
