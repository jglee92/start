name: 일일 가격 갱신

on:
  schedule:
    # 매 평일 UTC 10:00 = KST 19:00 (장마감 15:30 이후, 데이터 반영 여유)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 가격 증분 갱신 (배포DB)
        env:
          KR_DB_PATH: data/screener_deploy.db
        run: python update_data.py

      - name: 변경사항 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_deploy.db
          git diff --staged --quiet && echo "변경 없음" || \
            (git commit -m "chore: 일일 가격 갱신 $(date -u +%Y-%m-%d)" && git push)

      - name: 서버 캐시 갱신 (재시작 없이 새 데이터 반영)
        run: |
          curl -sf -X POST https://getmoneycheckup.com/api/refresh || \
            echo "::warning::/api/refresh 호출 실패 — 서버가 자연 재시작될 때까지 이전 캐시로 서빙됨"
