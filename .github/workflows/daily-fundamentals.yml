name: 재무·배당 갱신

on:
  schedule:
    # 매 평일 UTC 10:30 = KST 19:30 (일일 가격 갱신 이후). 원래 매주 월요일 1회였으나,
    # 기업들이 분기보고서를 월요일에 몰아서 내는 게 아니라 주중 여러 날 나눠 공시하므로
    # 매일로 늘려서 실적·이상신호 콘텐츠가 매일 새로워지게 함(DART 일일 한도 2만 건
    # 대비 현재 유니버스 호출량은 여유 충분).
    - cron: '30 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 스크립트 자체가 5시간에서 깔끔히 멈추지만(refresh_fundamentals.py의
    # MAX_RUNTIME_SEC), 혹시 모를 행업 대비 GH 기본 6시간 하드킬보다 여유있게
    # 잡 자체도 340분에서 끊어 커밋 단계 전에 죽는 사고(2026-07-20 실제 발생)를 방지.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 재무·배당 갱신 (배포DB, DART API)
        env:
          KR_DB_PATH: data/screener_deploy.db
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python refresh_fundamentals.py

      - name: 캐시(테마·법인코드) 최신본 유지
        run: echo "corp_map.json / naver_themes.json 은 별도 수동 갱신"

      - name: 변경사항 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_deploy.db
          git diff --staged --quiet && echo "변경 없음" || {
            git commit -m "chore: 재무·배당 갱신 $(date -u +%Y-%m-%d)"
            # 실행 시간이 몇 시간씩 걸려서(분기재무 수집), 그 사이 다른 커밋이 origin에
            # 먼저 올라가면 기존엔 그냥 push가 거절되고 이 실행분 전체가 유실됐음
            # (2026-07-22 실제로 겪음 — 5시간치 분기재무 4천여건이 통째로 날아감).
            # rebase로 먼저 따라잡은 뒤 push — data/screener_deploy.db를 동시에 건드리는
            # 다른 프로세스만 없으면 안전하게 합쳐짐.
            git fetch origin main
            if git rebase origin/main; then
              git push
            else
              echo "::error::rebase 충돌 — data/screener_deploy.db를 동시에 수정한 다른 작업이 있었을 수 있음. 수동 확인 필요."
              git rebase --abort
              exit 1
            fi
          }

      - name: 서버 캐시 갱신 (재시작 없이 새 데이터 반영)
        run: |
          curl -sf -X POST https://getmoneycheckup.com/api/refresh || \
            echo "::warning::/api/refresh 호출 실패 — 서버가 자연 재시작될 때까지 이전 캐시로 서빙됨"
