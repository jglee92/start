name: 간밤 미국증시·경제 정리 생성 (일)

on:
  schedule:
    # 미국장 마감(KST 05~06시) 후에 돌려 종가를 반영. UTC 22:00 = KST 07:00(다음날).
    # 요일 UTC 1-5(월~금) → KST 화~토 아침(미국 월~금 종가를 읽는 날).
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 간밤 미국증시·경제 정리 생성
        env:
          KR_DB_PATH: data/screener_deploy.db
          SITE_BASE_URL: https://getmoneycheckup.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_us_briefing.py

      - name: 변경 있으면 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/ data/claude_api_status.json
          if git diff --staged --quiet; then
            echo "변경 없음(지수 미수집 등)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 간밤 미국증시·경제 정리 생성 $DATE_KST"
            git push || (git pull --rebase && git push)
          fi
