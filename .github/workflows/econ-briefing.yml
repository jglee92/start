name: 오늘의 경제 뉴스 정리 생성 (일)

on:
  schedule:
    # 아침 정리용. UTC 21:00 = KST 06:00(다음날). 평일+토(월~토 KST) 대상.
    # 요일 UTC 0-5(일~금) → KST 월~토.
    - cron: '0 21 * * 0-5'
    # 백스톱 — GitHub Actions 스케줄 이벤트가 부하 시 통째로 드롭될 수 있는 알려진
    # 한계(daily-content.yml에서 2026-08-07 실제 발생, content-catchup.yml로 대응한
    # 전례와 동일)라, 정규 슬롯 이후로도 오전 중 재시도한다. generate_econ_briefing.py가
    # 멱등(오늘 것이 이미 있으면 즉시 스킵, 2026-09-04)이라 정상적인 날엔 몇 초짜리
    # no-op이고, 진짜 빠진 날에만 생성·커밋한다.
    # UTC 22:30,01:30,04:30 = KST 07:30, 10:30, 13:30.
    - cron: '30 22,1,4 * * 0-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: econ-briefing-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 경제 뉴스 정리 생성
        env:
          KR_DB_PATH: data/screener_deploy.db
          SITE_BASE_URL: https://getmoneycheckup.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 정리글에 곁들일 AI 배경 카드용(없으면 폴백 배경으로라도 1장 생성).
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python generate_econ_briefing.py

      - name: 변경 있으면 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/ data/claude_api_status.json
          if git diff --staged --quiet; then
            echo "변경 없음(키 미설정 또는 뉴스 부족)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 오늘의 경제 뉴스 정리 생성 $DATE_KST"
            git push || (git pull --rebase && git push)
          fi
