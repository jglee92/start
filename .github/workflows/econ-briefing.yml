name: 오늘의 경제 뉴스 정리 생성 (일)

on:
  schedule:
    # 아침 정리용. UTC 21:00 = KST 06:00(다음날). 평일+토(월~토 KST) 대상.
    # 요일 UTC 0-5(일~금) → KST 월~토.
    - cron: '0 21 * * 0-5'
    # 백스톱 — GitHub Actions 스케줄 이벤트가 부하 시 통째로 드롭될 수 있는 알려진
    # 한계(daily-content.yml에서 2026-08-07 실제 발생, content-catchup.yml로 대응한
    # 전례와 동일)라, 정규 슬롯 이후로도 오전 중 재시도한다. generate_econ_briefing.py가
    # 멱등(오늘 것이 이미 있으면 즉시 스킵, 2026-09-04)이라 정상적인 날엔 몇 초짜리
    # no-op이고, 진짜 빠진 날에만 생성·커밋한다.
    # UTC 22:30,01:30,04:30 = KST 07:30, 10:30, 13:30.
    - cron: '30 22,1,4 * * 0-5'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 것이 이미 있어도 강제 재생성(테스트용)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: econ-briefing-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 경제 뉴스 정리 생성
        env:
          KR_DB_PATH: data/screener_deploy.db
          SITE_BASE_URL: https://getmoneycheckup.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 정리글에 곁들일 AI 배경 카드용(없으면 폴백 배경으로라도 1장 생성).
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python generate_econ_briefing.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: 변경 있으면 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/ data/claude_api_status.json
          if git diff --staged --quiet; then
            echo "변경 없음(키 미설정 또는 뉴스 부족)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: 오늘의 경제 뉴스 정리 생성 $DATE_KST"
            # data/claude_api_status.json은 daily-content.yml 등 다른 워크플로우도 같이
            # 커밋하는 공유 카운터 파일이라, 비슷한 시각에 겹치면 그 파일에서만 rebase
            # 충돌이 나 애써 만든 econ_briefing.txt/econ.png 커밋 전체가 유실되는 사고가
            # 실제 있었음(2026-09-08, 원격에 daily-content.yml 커밋이 먼저 반영된 채
            # rebase가 이 파일 충돌로 실패 → push 자체가 안 됨). 그 파일 하나만 충돌하면
            # 그 충돌만 접어두고 진행(git rebase 중 --theirs는 병합 때와 반대로
            # '지금 재생 중인 이 커밋 자신의 값'을 뜻함 — 어느 쪽 숫자가 남든 단순
            # 집계 카운터라 상관없고, 다음 성공 실행이 다시 갱신하므로 손실도 없음).
            # 진짜 콘텐츠 충돌이면 여전히 실패시켜 수동 확인하게 한다.
            ok=0
            for i in 1 2; do
              if git push; then ok=1; break; fi
              git fetch origin main
              if git rebase origin/main; then continue; fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/claude_api_status.json" ]; then
                git checkout --theirs data/claude_api_status.json
                git add data/claude_api_status.json
                git rebase --continue
              else
                echo "::error::rebase 충돌(콘텐츠 파일 포함) — 수동 확인 필요: $conflicts"
                git rebase --abort
                exit 1
              fi
            done
            [ "$ok" = "1" ] || { echo "::error::재시도 후에도 push 실패"; exit 1; }
          fi
