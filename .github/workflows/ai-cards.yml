name: AI 배경 카드 후보 생성 (반자동)

on:
  schedule:
    # 자정 직후 생성(전일 종가는 전날 19:00 KST에 이미 갱신돼 있어 데이터 준비됨).
    # 아침이 아니라 00시에 만들어두면 GitHub 스케줄 지연이 몇 시간 나도 아침 훨씬
    # 전에 끝나 있다(로컬 자가복구 05:30~ 는 백업으로 유지). content_out/<날짜>/
    # ai_card_candidates/ 에 쌓임(사용자가 골라 게시). UTC 15:20 = KST 00:20(다음날).
    # 요일: UTC 0-5(일~금) → KST 월~토 자정. 이미지 API 키 없으면 폴백 배경만.
    - cron: '20 15 * * 0-5'
  workflow_dispatch:
    inputs:
      force:
        description: '휴장일에도 강제 생성(테스트용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: AI 배경 카드 후보 생성
        env:
          KR_DB_PATH: data/screener_deploy.db
          SITE_BASE_URL: https://getmoneycheckup.com
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python generate_ai_cards.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: 변경 있으면 커밋 + 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_out/
          if git diff --staged --quiet; then
            echo "변경 없음(휴장일이거나 후보 없음)."
          else
            DATE_KST=$(TZ='Asia/Seoul' date +%Y-%m-%d)
            git commit -m "chore: AI 배경 카드 후보 생성 $DATE_KST"
            git push || (git pull --rebase && git push)
          fi
