services:
  - type: web
    name: kr-screener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KR_DB_PATH
        value: data/screener_deploy.db
      - key: PYTHON_VERSION
        value: "3.12.10"
      # 배포 후 실제 URL로 설정 (예: https://kr-screener.onrender.com)
      - key: SITE_BASE_URL
        sync: false
